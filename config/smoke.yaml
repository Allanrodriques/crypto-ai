paths:
  raw_dir: data/raw_smoke
  processed_dir: data/processed_smoke
  predictions_dir: data/predictions_smoke
  models_dir: models_smoke
  reports_dir: reports_smoke
  metrics_dir: reports_smoke/metrics
  plots_dir: reports_smoke/plots
  backtests_dir: reports_smoke/backtests
data:
  symbol: BTCUSDT
  interval: 1h
  start_date: '2024-01-01'
  end_date: '2024-06-30'
  base_url: https://data-api.binance.vision
  fallback_base_urls:
  - https://api.binance.com
  - https://api-gcp.binance.com
  page_size: 1000
  weight_per_request: 2
  weight_limit_per_minute: 1200
  request_timeout_seconds: 30
  max_retries: 5
  retry_backoff_seconds: 2.0
  retry_backoff_max_seconds: 90.0
  retry_status_codes:
  - 418
  - 429
  - 500
  - 502
  - 503
  - 504
  pause_between_requests_seconds: 0.05
  drop_incomplete_candle: true
  save_metadata: true
  resume: true
validation:
  max_gap_candles: 2
  price_move_zscore_threshold: 20.0
  max_zero_volume_ratio: 0.01
  fail_on_error: false
  report_file: validation_report.json
target:
  horizon_candles: 6
  threshold: 0.005
features:
  sma_periods:
  - 10
  - 20
  - 50
  - 100
  - 200
  ema_periods:
  - 12
  - 26
  rsi_period: 14
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  roc_period: 12
  return_periods:
  - 1
  - 3
  - 6
  - 12
  - 24
  volume_sma_period: 20
  volume_lookback: 6
  volatility_lookbacks:
  - 20
  - 50
  periods_per_year: 8760
  eps: 1.0e-12
  feature_selection:
    enabled: false
    method: mutual_info
    k: 30
  scaling:
    enabled: true
    method: standard
model:
  random_state: 42
  logistic_regression:
    C: 1.0
    max_iter: 2000
    class_weight: balanced
    solver: lbfgs
  random_forest:
    n_estimators: 400
    max_depth: 12
    min_samples_leaf: 20
    max_features: sqrt
    n_jobs: -1
    class_weight: balanced_subsample
  xgboost:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    reg_lambda: 1.0
    reg_alpha: 0.0
    gamma: 0.0
    n_jobs: -1
    eval_metric: logloss
    early_stopping_rounds: 50
split:
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15
  purge_candles: null
cv:
  n_splits: 5
  gap: null
  min_train_size: 1000
backtest:
  initial_capital: 10000.0
  probability_threshold: 0.6
  transaction_cost_bps: 10.0
  allow_short: false
  max_concurrent_positions: 1
  exit_mode: horizon
  exit_probability: null
  risk_free_rate_annual: 0.0
  periods_per_year: 8760
  price_column: close
